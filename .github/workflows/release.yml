# 在 Windows 上打包 exe、實際跑一次、壓成 ZIP。
# 合併到 main 時，如果程式裡的版本號（__version__）還沒有發布過，就自動建立 v版本號 的 Release；
# 其他分支只打包和測試，ZIP 放在這次執行的 Artifacts 裡，可以下載先試用。
name: Release

on:
  push:
    branches: ['main', 'feature/**']
    paths: ['photo_color_sorter.py', 'build_exe.bat', 'requirements.txt', 'docs/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 讀取版本號，決定要不要發布
        shell: pwsh
        run: |
          $v = (Select-String -Path photo_color_sorter.py -Pattern "__version__ = '(.+)'").Matches[0].Groups[1].Value
          "TAG=v$v" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $publish = ($env:GITHUB_REF -eq 'refs/heads/main') -and -not $exists
          "PUBLISH=$publish" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          Write-Host "版本 v$v；已經發布過：$exists；這次發布：$publish"
          if (-not (Test-Path "docs\release-notes\v$v.md")) { throw "找不到發布說明 docs\release-notes\v$v.md" }
          exit 0

      - name: 用微軟正黑體重新產生使用教學 PDF（頁數不對就保留原本的）
        shell: pwsh
        run: |
          python -m pip install -q reportlab pypdf
          Copy-Item docs\使用教學.pdf $env:RUNNER_TEMP\tutorial_backup.pdf
          python docs\build_tutorial.py
          $pages = python -c "import pypdf; print(len(pypdf.PdfReader('docs/使用教學.pdf').pages))"
          if ($LASTEXITCODE -ne 0 -or $pages -ne '4') {
            Write-Host "產生的 PDF 有 $pages 頁，改用原本的版本"
            Copy-Item $env:RUNNER_TEMP\tutorial_backup.pdf docs\使用教學.pdf -Force
          }
        continue-on-error: true

      - name: 打包 exe（含自動測試）
        shell: cmd
        run: build_exe.bat

      - name: 實際執行打包好的 exe
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force $d | Out-Null
          .venv\Scripts\python.exe -c "import numpy as np, cv2, sys; img = np.zeros((300, 400, 3), np.uint8); img[:] = (255, 0, 0); cv2.imwrite(sys.argv[1] + '/blue.jpg', img)" $d
          $p = Start-Process -FilePath dist\PhotoColorSorter\PhotoColorSorter.exe -ArgumentList "`"$d`"", '--preview', '--csv', "`"$d\out.csv`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exe 結束代碼 $($p.ExitCode)" }
          $csv = Get-Content "$d\out.csv" -Encoding UTF8
          Write-Host ($csv -join "`n")
          if (-not ($csv -match 'blue\.jpg')) { throw 'exe 沒有產生正確的 CSV' }

      - name: 壓縮成 ZIP 並計算 SHA-256
        id: zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\PhotoColorSorter -DestinationPath PhotoColorSorter-Windows.zip -Force
          $h = (Get-FileHash PhotoColorSorter-Windows.zip -Algorithm SHA256).Hash.ToLower()
          $mb = [math]::Round((Get-Item PhotoColorSorter-Windows.zip).Length / 1MB)
          $notes = "docs\release-notes\$env:TAG.md"
          $body = (Get-Content $notes -Raw -Encoding UTF8).Replace('{SHA256}', $h).Replace('{SIZE_MB}', "$mb")
          Set-Content -Path release-notes.md -Value $body -Encoding UTF8
          Write-Host "SHA-256: $h  大小: $mb MB"

      - name: 保存 ZIP（這次執行的 Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: PhotoColorSorter-Windows-${{ env.TAG }}
          path: |
            PhotoColorSorter-Windows.zip
            release-notes.md

      - name: 發布到 Releases（只在 main 而且這個版本還沒發布過）
        if: env.PUBLISH == 'True'
        shell: pwsh
        run: |
          gh release create $env:TAG PhotoColorSorter-Windows.zip --target $env:GITHUB_SHA `
            --title "$env:TAG 舞台照片色彩分類工具" --notes-file release-notes.md --latest
